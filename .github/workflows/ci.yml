name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Addresses seen by the OS backend
        run: cargo run --locked -q -- --dump-addresses

  # The install jobs run the README's install steps verbatim, then check the
  # running service: a test address, IPv4 via [::], the unprivileged account,
  # and that a non-allowlisted source is dropped.

  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - name: Start the user service manager
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
      - name: Install (README steps, local build instead of the download)
        run: .github/ci/readme-install.sh '### Linux' target/release/ipv6who ipv6who
      - name: Change options (README)
        run: |
          sed -i 's|^ExecStart=.*|& --include-temporary|' ~/ipv6who/ipv6who.service
          systemctl --user daemon-reload && systemctl --user restart ipv6who
          sleep 1
          pgrep -a ipv6who | grep -- --include-temporary
      - name: Add a test address
        run: |
          sudo ip link add ipv6who0 type dummy
          sudo ip link set ipv6who0 up
          sudo ip -6 addr add 2001:db8::1/64 dev ipv6who0 nodad
      - name: Verify
        run: |
          .github/ci/verify-unix.sh "$USER" "$(hostname -I | awk '{print $1}')"
          grep -q listening ~/ipv6who/ipv6who.log
      - name: Logs
        if: always()
        run: cat -v ~/ipv6who/ipv6who.log || true
      - name: Uninstall (README steps)
        run: |
          systemctl --user disable --now ipv6who
          rm -rf ~/ipv6who
          ! pgrep -x ipv6who

  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - name: Install (README steps, local build instead of the download)
        run: .github/ci/readme-install.sh '### macOS' target/release/ipv6who '~/.local/bin/ipv6who'
      - name: Change options (README)
        run: |
          plutil -insert ProgramArguments.5 -string --include-temporary ~/Library/LaunchAgents/io.github.zhangchaosd.ipv6who.plist
          launchctl bootout gui/$(id -u)/io.github.zhangchaosd.ipv6who
          sleep 2
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/io.github.zhangchaosd.ipv6who.plist
          sleep 1
          pgrep -lf ipv6who | grep -- --include-temporary
      - name: Add a test address
        run: sudo ifconfig lo0 inet6 2001:db8::1 prefixlen 128 alias
      - name: Verify
        run: |
          .github/ci/verify-unix.sh "$USER" "$(ipconfig getifaddr "$(route -n get default | awk '/interface:/{print $2}')")"
          grep -q listening ~/Library/Logs/ipv6who.log
      - name: Logs
        if: always()
        run: |
          launchctl print gui/$(id -u)/io.github.zhangchaosd.ipv6who || true
          cat ~/Library/Logs/ipv6who.log || true
      - name: Uninstall (README steps)
        run: |
          launchctl bootout gui/$(id -u)/io.github.zhangchaosd.ipv6who
          rm ~/.local/bin/ipv6who ~/Library/LaunchAgents/io.github.zhangchaosd.ipv6who.plist ~/Library/Logs/ipv6who.log
          sleep 2
          ! pgrep -x ipv6who

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - name: Install (README steps, local build instead of the download)
        shell: pwsh
        run: .github/ci/readme-install.ps1 target\release\ipv6who.exe
      - name: Change options (README)
        shell: pwsh
        run: |
          Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\ipv6who ImagePath '"C:\Program Files\ipv6who\ipv6who.exe" --service --listen [::]:8066 --allow ::1/128,127.0.0.0/8,192.168.1.0/24 --log-file C:\ProgramData\ipv6who\logs\ipv6who.log'
          Restart-Service ipv6who
          (Get-CimInstance Win32_Process -Filter "Name='ipv6who.exe'").CommandLine
      - name: Add a test address
        shell: pwsh
        run: |
          # Pick an interface that actually has IPv6 bound and connected.
          $if = Get-NetIPInterface -AddressFamily IPv6 -ConnectionState Connected |
              Where-Object InterfaceAlias -notlike 'Loopback*' | Select-Object -First 1
          Write-Host "adding 2001:db8::1 to $($if.InterfaceAlias)"
          New-NetIPAddress -InterfaceIndex $if.ifIndex -IPAddress 2001:db8::1 -PrefixLength 64 | Out-Null
      - name: Verify
        shell: pwsh
        run: .github/ci/verify-windows.ps1
      - name: Logs
        if: always()
        shell: pwsh
        run: |
          Get-Service ipv6who -ErrorAction SilentlyContinue | Format-List *
          Get-Content C:\ProgramData\ipv6who\logs\ipv6who.log -ErrorAction SilentlyContinue
      - name: Uninstall (README steps)
        shell: pwsh
        run: |
          Stop-Service ipv6who
          sc.exe delete ipv6who
          Remove-Item -Recurse -Force "C:\Program Files\ipv6who", C:\ProgramData\ipv6who
          if (Get-Process ipv6who -ErrorAction SilentlyContinue) { throw 'still running' }

  # Release artifacts. Every run uploads them to the workflow run; a pushed
  # v* tag also publishes them as a GitHub Release.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, label: macos-universal, target: aarch64-apple-darwin x86_64-apple-darwin }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, label: windows-aarch64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          command -v rustup >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          for t in ${{ matrix.target }}; do rustup target add "$t"; done
          if [[ "${{ matrix.target }}" == *musl ]]; then sudo apt-get update -q && sudo apt-get install -yq musl-tools; fi
      - name: Build
        run: |
          for t in ${{ matrix.target }}; do cargo build --locked --profile dist --target "$t"; done
          case "${{ matrix.label }}" in
            macos-universal)
              lipo -create -output ipv6who target/aarch64-apple-darwin/dist/ipv6who target/x86_64-apple-darwin/dist/ipv6who
              lipo -info ipv6who ;;
            windows-*) cp "target/${{ matrix.target }}/dist/ipv6who.exe" ipv6who.exe ;;
            *) cp "target/${{ matrix.target }}/dist/ipv6who" ipv6who ;;
          esac
      - name: Smoke test
        if: matrix.label != 'windows-aarch64'
        run: |
          bin=./ipv6who; [[ -f ipv6who.exe ]] && bin=./ipv6who.exe
          file "$bin" || true
          "$bin" --version
          "$bin" --dump-addresses > /dev/null
      - name: Package
        run: |
          bin=ipv6who; [[ -f ipv6who.exe ]] && bin=ipv6who.exe
          .github/ci/package.sh "$bin" "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ipv6who-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-linux, install-macos, install-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
