# ipv6who configuration. All keys are optional; defaults are shown.

# Socket addresses to listen on. "[::]" also accepts IPv4.
listen = ["[::]:8066"]

# Client networks (CIDR) allowed to connect. Connections from any other
# address are closed immediately after accept, before HTTP is parsed.
# An empty list rejects everyone.
allow = ["::1/128", "127.0.0.0/8"]

# Optional bearer token required for /v1/* (not for /healthz).
# Clients send:  Authorization: Bearer <token>
# Note: this file must be readable by the service, so keep it 0644 only
# on hosts where local users may see the token.
# token = "change-me"

# Also report RFC 8981 temporary (privacy extension) addresses.
include_temporary = false

[interfaces]
# Interface names as the OS shows them: Linux "eth0", macOS "en0",
# Windows the adapter name such as "Ethernet" or "Wi-Fi".
# If non-empty, only consider these interfaces. A trailing "*" matches any suffix.
include = []
# Never consider these interfaces. Takes precedence over include.
exclude = ["lo", "docker*", "veth*", "br-*", "virbr*"]
