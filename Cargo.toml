[package]
name = "ipv6who"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small HTTP service that reports the global IPv6 address of the host, with an IP allowlist"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zhangchaosd/ipv6who"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.34"
rtnetlink = "0.23.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["io-util", "macros", "rt"] }
