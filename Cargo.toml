[package]
name = "ipv6who"
version = "0.1.0"
edition = "2024"
description = "A small HTTP service that reports the global IPv6 address of the host, with an IP allowlist"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zhangchaosd/ipv6who"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.34"
rtnetlink = "0.23.0"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["io-util", "macros", "rt"] }
